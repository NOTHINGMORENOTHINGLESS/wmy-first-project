<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Match Narrative Demo</title>
    <style>
      :root {
        --bg: #081b1f;
        --bg-2: #0d2a30;
        --panel: rgba(11, 26, 31, 0.9);
        --card: rgba(15, 36, 42, 0.9);
        --line: rgba(126, 219, 219, 0.22);
        --cyan: #8ee4d2;
        --blue: #66d4ff;
        --amber: #ffc857;
        --red: #ff7b7b;
        --green: #86efac;
        --text: #edf7f7;
        --muted: #9ec7c6;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(102, 212, 255, 0.18), transparent 35%),
          linear-gradient(135deg, var(--bg), var(--bg-2));
        color: var(--text);
      }

      .page {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }

      .team-strip {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 0.95rem;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        font-weight: 800;
        letter-spacing: 0.04em;
        background: rgba(142, 228, 210, 0.16);
        color: var(--cyan);
        border: 1px solid rgba(142, 228, 210, 0.32);
      }

      .score {
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: 0.05em;
      }

      .score small {
        opacity: 0.72;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .mini-label {
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .mode-select {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(16, 38, 45, 0.85);
      }

      select {
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 0.96rem;
        outline: none;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(320px, 0.8fr);
        gap: 20px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.22);
      }

      .pitch-panel {
        padding: 18px;
      }

      .pitch-wrapper {
        position: relative;
        padding: 14px;
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(18, 62, 53, 0.9), rgba(9, 35, 32, 0.95));
        border: 1px solid rgba(142, 228, 210, 0.28);
      }

      .pitch {
        position: relative;
        aspect-ratio: 1.5;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        border-radius: 18px;
        overflow: hidden;
        background:
          linear-gradient(rgba(255,255,255,0.05), rgba(255,255,255,0.02)),
          linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
          linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
          #0f5d4c;
        background-size: auto, 33.333% 100%, 100% 33.333%, auto;
      }

      .zone {
        position: relative;
        padding: 12px;
        border: 1px solid rgba(255,255,255,0.08);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: rgba(255,255,255,0.02);
      }

      .zone-label {
        font-size: 0.62rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(237, 247, 247, 0.64);
      }

      .event-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 5px 9px;
        width: fit-content;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        border: 1px solid transparent;
      }

      .home { color: var(--cyan); background: rgba(142, 228, 210, 0.12); border-color: rgba(142, 228, 210, 0.3); }
      .away { color: var(--amber); background: rgba(255, 200, 87, 0.12); border-color: rgba(255, 200, 87, 0.3); }
      .neutral { color: var(--text); background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); }

      .zone-1 { background: rgba(111, 178, 206, 0.09); }
      .zone-2 { background: rgba(64, 201, 163, 0.06); }
      .zone-3 { background: rgba(255, 200, 87, 0.07); }
      .zone-4 { background: rgba(102, 212, 255, 0.08); }
      .zone-5 { background: rgba(142, 228, 210, 0.06); }
      .zone-6 { background: rgba(255, 123, 123, 0.06); }
      .zone-7 { background: rgba(134, 239, 172, 0.06); }
      .zone-8 { background: rgba(102, 212, 255, 0.08); }
      .zone-9 { background: rgba(255, 200, 87, 0.06); }

      .pitch-legend {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 12px;
        padding: 0 4px;
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .legend-dots {
        display: flex;
        gap: 16px;
        align-items: center;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }

      .dot.home { background: var(--cyan); }
      .dot.away { background: var(--amber); }
      .dot.neutral { background: rgba(255,255,255,0.5); }

      .narrative-panel {
        padding: 18px;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .panel-header h2 {
        margin: 0;
        font-size: 0.9rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .metric-box {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }

      .metric {
        padding: 12px 10px;
        border-radius: 14px;
        background: rgba(18, 45, 52, 0.7);
        border: 1px solid var(--line);
      }

      .metric .number {
        display: block;
        font-size: 1.1rem;
        font-weight: 800;
        margin-bottom: 4px;
      }

      .metric .label {
        font-size: 0.65rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .momentum-box {
        background: rgba(9, 23, 27, 0.8);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        margin-bottom: 16px;
      }

      .momentum-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .momentum-chart {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 6px;
        align-items: end;
        height: 118px;
        padding: 8px 4px 0;
      }

      .candle {
        position: relative;
        height: 100%;
        border-radius: 8px 8px 4px 4px;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
        display: flex;
        align-items: end;
        justify-content: center;
      }

      .candle::before {
        content: "";
        position: absolute;
        width: 6px;
        min-height: 24px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 999px;
        background: rgba(255,255,255,0.9);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
      }

      .positive { background: linear-gradient(180deg, rgba(134, 239, 172, 0.9), rgba(134, 239, 172, 0.18)); }
      .negative { background: linear-gradient(180deg, rgba(255, 123, 123, 0.88), rgba(255, 123, 123, 0.18)); }
      .neutral-candle { background: linear-gradient(180deg, rgba(102, 212, 255, 0.85), rgba(102, 212, 255, 0.18)); }

      .narrative-box {
        background: rgba(10, 26, 32, 0.7);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
      }

      .narrative-title {
        margin: 0 0 8px;
        font-size: 0.8rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .story {
        margin: 0;
        line-height: 1.6;
        color: var(--text);
        font-size: 0.98rem;
      }

      .story strong {
        color: var(--cyan);
      }

      .story-list {
        margin: 14px 0 0;
        padding-left: 18px;
        color: var(--muted);
        line-height: 1.7;
      }

      @media (max-width: 920px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="team-strip">
          <div class="badge">H</div>
          <div>
            <div class="mini-label">Home</div>
            <div><strong>Harbor FC</strong></div>
          </div>
          <div class="score">2 <small>vs</small> 1</div>
          <div>
            <div class="mini-label">Away</div>
            <div><strong>Fenside United</strong></div>
          </div>
          <div class="badge" style="background: rgba(255, 200, 87, 0.16); color: var(--amber); border-color: rgba(255, 200, 87, 0.32);">F</div>
        </div>

        <div class="mode-select">
          <label for="mode" class="mini-label" style="margin: 0;">Narrative mode</label>
          <select id="mode" aria-label="Narrative mode">
            <option value="tempo">Tempo Shift</option>
            <option value="pressure">Pressure Build</option>
            <option value="transitions">Transitions</option>
            <option value="finalthird">Final Third</option>
          </select>
        </div>
      </header>

      <main class="layout">
        <section class="panel pitch-panel">
          <div class="pitch-wrapper">
            <div class="pitch" id="pitch"></div>
            <div class="pitch-legend">
              <span>Pitch map</span>
              <div class="legend-dots">
                <span><span class="dot home"></span> Harbor</span>
                <span><span class="dot away"></span> Fenside</span>
                <span><span class="dot neutral"></span> Neutral</span>
              </div>
            </div>
          </div>
        </section>

        <aside class="panel narrative-panel">
          <div class="panel-header">
            <h2>Match pulse</h2>
            <span class="mini-label" id="clock">68'</span>
          </div>

          <div class="metric-box">
            <div class="metric">
              <span class="number" id="possession">52%</span>
              <span class="label">Possession</span>
            </div>
            <div class="metric">
              <span class="number" id="xg">1.76</span>
              <span class="label">xG</span>
            </div>
            <div class="metric">
              <span class="number" id="duels">11</span>
              <span class="label">Duels won</span>
            </div>
          </div>

          <div class="momentum-box">
            <div class="momentum-header">
              <span>Momentum</span>
              <span id="momentum-value">+18</span>
            </div>
            <div class="momentum-chart" id="momentum-chart"></div>
          </div>

          <div class="narrative-box">
            <p class="narrative-title">Narrative</p>
            <p class="story" id="story-text"></p>
            <ul class="story-list" id="story-list"></ul>
          </div>
        </aside>
      </main>
    </div>

    <script>
      const pitchData = [
        { id: 'Z1', tag: 'Harbor', tone: 'home', text: 'Aerial win' },
        { id: 'Z2', tag: 'Neutral', tone: 'neutral', text: 'Reset' },
        { id: 'Z3', tag: 'Fenside', tone: 'away', text: 'Press trigger' },
        { id: 'Z4', tag: 'Harbor', tone: 'home', text: 'Diagonal run' },
        { id: 'Z5', tag: 'Neutral', tone: 'neutral', text: 'Transition' },
        { id: 'Z6', tag: 'Fenside', tone: 'away', text: 'Counter' },
        { id: 'Z7', tag: 'Harbor', tone: 'home', text: 'Overlap' },
        { id: 'Z8', tag: 'Neutral', tone: 'neutral', text: 'Staggered block' },
        { id: 'Z9', tag: 'Fenside', tone: 'away', text: 'Box edge' }
      ];

      const modes = {
        tempo: {
          headline: 'Harbor are seizing the midfield rhythm after the restart, pinning Fenside behind their first line and forcing the ball wide before the central lane collapses.',
          bullets: [
            'Right-side overload creates a steady turnover pattern.',
            'The midfield five recover the ball in under 3 seconds.',
            'Fenside are forced to defend with a compact back line.'
          ],
          metrics: { poss: '52%', xg: '1.76', duels: '11' }
        },
        pressure: {
          headline: 'The pressure curve is steepening: Harbor win the second balls and attack the half-space with intent, creating a chain of entries that pushes Fenside into repeated recovery moments.',
          bullets: [
            'Five of the last seven possessions began in the central corridor.',
            'High press has trapped Fenside wide on the left channel.',
            'The home side are attacking the shoulders of the fullbacks.'
          ],
          metrics: { poss: '58%', xg: '2.12', duels: '14' }
        },
        transitions: {
          headline: 'The game is being decided in transition. Harbor are moving faster after regains, while Fenside are unable to reset their shape before the home side arrive in the box.',
          bullets: [
            'Transition count: 9 rapid attacks in the last 10 minutes.',
            'Two vertical passes split the midfield triangle.',
            'Harbor are attacking into the half-space with an extra runner.'
          ],
          metrics: { poss: '49%', xg: '1.92', duels: '9' }
        },
        finalthird: {
          headline: 'The final third is alive with end-to-end movement: the winger drops, the striker pins the center-back, and the half-space runner arrives just in time to finish the sequence.',
          bullets: [
            'Seven entries to the final third in the last six minutes.',
            'Harbor have completed 15 progressive carries.',
            'Fenside are defending with a low block and narrow angles.'
          ],
          metrics: { poss: '55%', xg: '2.34', duels: '13' }
        }
      };

      const pitch = document.getElementById('pitch');
      pitchData.forEach((zone, index) => {
        const item = document.createElement('div');
        item.className = `zone zone-${index + 1} ${zone.tone === 'home' ? 'home-zone' : zone.tone === 'away' ? 'away-zone' : ''}`;
        item.innerHTML = `
          <div class="zone-label">${zone.id}</div>
          <div class="event-chip ${zone.tone}">${zone.tag}</div>
          <div style="font-size:0.72rem;color:rgba(237,247,247,0.8);">${zone.text}</div>
        `;
        pitch.appendChild(item);
      });

      const storyText = document.getElementById('story-text');
      const storyList = document.getElementById('story-list');
      const modeSelect = document.getElementById('mode');

      function updateNarrative(mode) {
        const data = modes[mode];
        storyText.innerHTML = `<strong>${data.headline.split(' ')[0]}</strong> ${data.headline.slice(data.headline.indexOf(' ') + 1)}`;
        storyList.innerHTML = data.bullets.map(item => `<li>${item}</li>`).join('');

        document.getElementById('possession').textContent = data.metrics.poss;
        document.getElementById('xg').textContent = data.metrics.xg;
        document.getElementById('duels').textContent = data.metrics.duels;
      }

      modeSelect.addEventListener('change', (event) => updateNarrative(event.target.value));
      updateNarrative(modeSelect.value);

      const momentumChart = document.getElementById('momentum-chart');
      const candleValues = [48, 62, 58, 74, 68, 82, 76, 88, 72, 96, 90, 78];
      candleValues.forEach((value, index) => {
        const bar = document.createElement('div');
        const height = (value / 100) * 100;
        const tone = value >= 70 ? 'positive' : value <= 40 ? 'negative' : 'neutral-candle';
        bar.className = `candle ${tone}`;
        bar.style.height = `${height}%`;
        bar.title = `Momentum ${value}`;
        bar.setAttribute('aria-label', `Momentum value ${value}`);
        momentumChart.appendChild(bar);
      });

      document.getElementById('momentum-value').textContent = '+18';
    </script>
  </body>
</html>
