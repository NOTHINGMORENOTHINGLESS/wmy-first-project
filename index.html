<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Match Insight Demo</title>
    <style>
      :root {
        --bg: #081b1f;
        --bg-2: #0b2a2f;
        --panel: rgba(10, 25, 32, 0.9);
        --panel-2: rgba(15, 34, 41, 0.88);
        --line: rgba(132, 215, 224, 0.24);
        --cyan: #8ae4d1;
        --blue: #73d5ff;
        --amber: #ffc857;
        --red: #ff7d7d;
        --green: #9ae6b4;
        --text: #ecf9f8;
        --muted: #9ec8c6;
        --shadow: rgba(0, 0, 0, 0.25);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(115, 213, 255, 0.18), transparent 28%),
          linear-gradient(135deg, var(--bg), var(--bg-2));
        color: var(--text);
      }

      .page {
        max-width: 1360px;
        margin: 0 auto;
        padding: 28px 18px 40px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 20px;
      }

      .team-strip {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .team-pill {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .crest {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        border: 1px solid var(--line);
      }

      .crest.home { background: rgba(138, 228, 209, 0.12); color: var(--cyan); }
      .crest.away { background: rgba(255, 200, 87, 0.12); color: var(--amber); }

      .mini-label {
        font-size: 0.66rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .score {
        font-size: 1.9rem;
        font-weight: 800;
        letter-spacing: 0.06em;
      }

      .score small {
        opacity: 0.75;
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 20px 70px var(--shadow);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.9fr) minmax(360px, 0.95fr);
        gap: 18px;
        align-items: stretch;
      }

      .pitch-panel {
        padding: 18px;
      }

      .pitch-wrap {
        border-radius: 18px;
        border: 1px solid rgba(138, 228, 209, 0.26);
        background: linear-gradient(180deg, rgba(18, 78, 68, 0.9), rgba(7, 32, 31, 0.95));
        padding: 14px;
      }

      .pitch {
        position: relative;
        aspect-ratio: 1.5;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        border-radius: 16px;
        overflow: hidden;
        background:
          linear-gradient(rgba(255,255,255,0.06), rgba(255,255,255,0.02)),
          linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
          linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
          #195f53;
        background-size: auto, 33.333% 100%, 100% 33.333%, auto;
      }

      .zone {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 12px;
        border: 1px solid rgba(255,255,255,0.08);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .zone:hover { transform: translateY(-1px); }

      .zone-label {
        font-size: 0.62rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(236,249,248,0.68);
      }

      .zone-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: fit-content;
        padding: 6px 8px;
        border-radius: 999px;
        font-size: 0.68rem;
        font-weight: 700;
        border: 1px solid transparent;
        background: rgba(255,255,255,0.04);
        color: var(--text);
      }

      .zone-badge.home { color: var(--cyan); background: rgba(138, 228, 209, 0.12); border-color: rgba(138, 228, 209, 0.34); }
      .zone-badge.away { color: var(--amber); background: rgba(255, 200, 87, 0.14); border-color: rgba(255, 200, 87, 0.3); }
      .zone-badge.neutral { color: var(--text); background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); }

      .zone.active {
        box-shadow: inset 0 0 0 2px rgba(138, 228, 209, 0.7);
        border-color: rgba(138, 228, 209, 0.7);
        background: rgba(138, 228, 209, 0.08);
      }

      .pitch-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
        padding: 0 4px;
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .legend {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .legend-item { display: inline-flex; align-items: center; gap: 7px; }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }
      .dot.home { background: var(--cyan); }
      .dot.away { background: var(--amber); }
      .dot.neutral { background: rgba(255,255,255,0.6); }

      .momentum-panel,
      .narrative-panel {
        padding: 18px;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .panel-header h2 {
        margin: 0;
        font-size: 0.76rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .mode-select {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(14, 36, 43, 0.8);
        border: 1px solid var(--line);
      }

      select {
        background: transparent;
        border: none;
        color: var(--text);
        outline: none;
        font-size: 0.95rem;
      }

      .momentum-box {
        background: rgba(7, 22, 28, 0.9);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px 12px 10px;
      }

      .momentum-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 0.68rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .momentum-chart {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
        align-items: end;
        height: 150px;
        padding: 4px 2px 0;
      }

      .candle {
        position: relative;
        display: flex;
        align-items: end;
        justify-content: center;
        min-height: 30px;
        border-radius: 10px 10px 6px 6px;
        border: 1px solid rgba(255,255,255,0.08);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      }

      .candle::before {
        content: "";
        position: absolute;
        width: 6px;
        min-height: 26px;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 999px;
        background: rgba(255,255,255,0.9);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
      }

      .candle:hover,
      .candle.active {
        transform: translateY(-2px);
        border-color: rgba(138, 228, 209, 0.55);
        box-shadow: 0 12px 26px rgba(0,0,0,0.18);
      }

      .candle.positive { background: linear-gradient(180deg, rgba(154, 230, 180, 0.9), rgba(154, 230, 180, 0.22)); }
      .candle.negative { background: linear-gradient(180deg, rgba(255, 125, 125, 0.82), rgba(255, 125, 125, 0.18)); }
      .candle.neutral { background: linear-gradient(180deg, rgba(115, 213, 255, 0.78), rgba(115, 213, 255, 0.18)); }

      .minute-label {
        position: absolute;
        bottom: -22px;
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .narrative-box {
        margin-top: 16px;
        background: rgba(10, 25, 32, 0.8);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
      }

      .event-tag {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(138, 228, 209, 0.10);
        color: var(--cyan);
        border: 1px solid rgba(138, 228, 209, 0.35);
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .narrative-text {
        margin: 0;
        line-height: 1.65;
        font-size: 1rem;
      }

      .narrative-text strong { color: var(--cyan); }

      .event-list {
        list-style: none;
        margin: 14px 0 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }

      .event-list li {
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.06);
        color: var(--muted);
        line-height: 1.5;
      }

      .event-list strong { color: var(--text); }

      .analysis-box {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(19, 48, 56, 0.72);
        border: 1px solid var(--line);
      }

      .analysis-box h3 {
        margin: 0 0 8px;
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .analysis-box p {
        margin: 0;
        color: var(--text);
        line-height: 1.6;
      }

      @media (max-width: 1080px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="team-strip">
          <div class="team-pill">
            <div class="crest home">H</div>
            <div>
              <div class="mini-label">Home</div>
              <div><strong>Harbor FC</strong></div>
            </div>
          </div>
          <div class="score">2 <small>vs</small> 1</div>
          <div class="team-pill">
            <div>
              <div class="mini-label">Away</div>
              <div><strong>Fenside United</strong></div>
            </div>
            <div class="crest away">F</div>
          </div>
        </div>

        <div class="mode-select">
          <label for="mode" class="mini-label" style="margin:0;">Mode</label>
          <select id="mode" aria-label="Narrative mode">
            <option value="casual">Casual</option>
            <option value="casual-spanish">Casual (Spanish)</option>
            <option value="analyst">Analyst</option>
          </select>
        </div>
      </header>

      <main class="layout">
        <section class="panel pitch-panel">
          <div class="pitch-wrap">
            <div class="pitch" id="pitch"></div>
            <div class="pitch-footer">
              <span>Pitch map</span>
              <div class="legend">
                <span class="legend-item"><span class="dot home"></span> Harbor</span>
                <span class="legend-item"><span class="dot away"></span> Fenside</span>
                <span class="legend-item"><span class="dot neutral"></span> Neutral</span>
              </div>
            </div>
          </div>
        </section>

        <section class="panel momentum-panel">
          <div class="panel-header">
            <h2>Momentum</h2>
            <span class="mini-label" id="momentum-badge">+18</span>
          </div>
          <div class="momentum-box">
            <div class="momentum-header">
              <span>Last 5 min</span>
              <span id="minute-range">61'–65'</span>
            </div>
            <div class="momentum-chart" id="chart"></div>
          </div>
        </section>

        <aside class="panel narrative-panel">
          <div class="panel-header">
            <h2>Narrative</h2>
            <span class="mini-label" id="clock">61'</span>
          </div>

          <div class="narrative-box">
            <div class="event-tag" id="event-tag">Pace mismatch</div>
            <p class="narrative-text" id="narrative-text"></p>
            <ul class="event-list" id="event-list"></ul>
          </div>

          <div class="analysis-box">
            <h3>Explainability</h3>
            <p id="analysis-text"></p>
          </div>
        </aside>
      </main>
    </div>

    <script>
      const zones = [
        { id: 'Z1', label: 'R1', tone: 'home' },
        { id: 'Z2', label: 'R2', tone: 'neutral' },
        { id: 'Z3', label: 'R3', tone: 'away' },
        { id: 'Z4', label: 'C1', tone: 'home' },
        { id: 'Z5', label: 'C2', tone: 'neutral' },
        { id: 'Z6', label: 'C3', tone: 'away' },
        { id: 'Z7', label: 'L1', tone: 'home' },
        { id: 'Z8', label: 'L2', tone: 'neutral' },
        { id: 'Z9', label: 'L3', tone: 'away' }
      ];

      const pitch = document.getElementById('pitch');
      zones.forEach((zone) => {
        const el = document.createElement('div');
        el.className = `zone ${zone.tone}`;
        el.dataset.zone = zone.id;
        el.innerHTML = `
          <div class="zone-label">${zone.id}</div>
          <div class="zone-badge ${zone.tone}">${zone.label}</div>
        `;
        pitch.appendChild(el);
      });

      const minutes = [
        {
          minute: 61,
          pattern: 'pace_mismatch',
          patternLabel: 'Pace mismatch',
          xg: 0.34,
          momentum: 68,
          narrativeKey: 0,
          representative: "61' through ball, xG 0.34",
          mainEvent: "Adebayo attacks the right channel and beats Lewis to the byline.",
          events: [
            "Adebayo receives in R2 and turns on the outside before the full-back can recover.",
            "Short pass into the half-space, then a vertical carry toward the box edge.",
            "Lewis is dragged wide and isolated against a faster winger."
          ],
          zones: ['Z1', 'Z2', 'Z4']
        },
        {
          minute: 62,
          pattern: 'zone_shift',
          patternLabel: 'Zone shift',
          xg: 0.28,
          momentum: 76,
          narrativeKey: 1,
          representative: "62' switch of play, xG 0.28",
          mainEvent: "Harbor switch focus from the right to the left side after a slow Fenside press.",
          events: [
            "The build-up pivots from the right flank to the left half-space.",
            "The midfield three open a passing lane into L2 and L3.",
            "The defender's body shape changes after the ball moves away from the original right-side overload."
          ],
          zones: ['Z7', 'Z8', 'Z9']
        },
        {
          minute: 63,
          pattern: 'one_two',
          patternLabel: 'One-two',
          xg: 0.41,
          momentum: 84,
          narrativeKey: 2,
          representative: "63' one-two, xG 0.41",
          mainEvent: "Niko and Bale combine in the central lane before the striker breaks behind the line.",
          events: [
            "Bale drops short to receive the first pass at C2.",
            "Niko checks away, then plays the return pass on the half-turn.",
            "The sequence creates a lane into the box and forces the center-back to step."
          ],
          zones: ['Z5', 'Z6', 'Z8']
        },
        {
          minute: 64,
          pattern: 'pace_mismatch',
          patternLabel: 'Pace mismatch',
          xg: 0.39,
          momentum: 88,
          narrativeKey: 0,
          representative: "64' burst behind the back line, xG 0.39",
          mainEvent: "Adebayo again isolates the slower full-back and wins the race into the box.",
          events: [
            "Right-wide carry causes the defending full-back to retreat before the ball arrives.",
            "The winger stays behind the defender and threatens the channel again.",
            "Pressure remains on the outside because the center-back cannot recover in time."
          ],
          zones: ['Z2', 'Z3', 'Z4']
        },
        {
          minute: 65,
          pattern: 'zone_shift',
          patternLabel: 'Zone shift',
          xg: 0.36,
          momentum: 79,
          narrativeKey: 1,
          representative: "65' left-side switch, xG 0.36",
          mainEvent: "The attack shifts from the right to the left side and finds space behind the shoulder of the left-back.",
          events: [
            "The pass is moved quickly from the right to the left half-space.",
            "The shape changes as the full-back steps into a higher line and the winger attacks the back shoulder.",
            "This second-phase pattern creates the cleanest chance of the sequence."
          ],
          zones: ['Z7', 'Z8', 'Z9']
        }
      ];

      const casualTemplates = {
        pace_mismatch: [
          "The right side is a sprint race. [winger] keeps attacking [fullback] in [zone], and the defender never gets to the ball first.",
          "This is a classic mismatch: [winger] is simply quicker than [fullback]. Every time the ball goes wide, the channel turns into a burning question of pace.",
          "The home side are getting their threat by running [winger] behind [fullback] rather than trying to play through the middle."
        ],
        zone_shift: [
          "The attack has suddenly switched from the right to the left. That change in focus opens [zone] and forces the away side to readjust on the run.",
          "The ball has moved away from the original overload, and now the pressure is landing on the left side instead of the right.",
          "They saw the right side was crowded, so the move turned to [zone], and the defenders had to rush to recover."
        ],
        one_two: [
          "That first touch was tidy, but the real danger was the one-two between [playerA] and [playerB]. It created space in [zone] without needing a long pass.",
          "The move is clean and quick: [playerA] plays short, [playerB] turns, and the return pass opens the lane behind the line.",
          "A quick exchange in [zone] keeps the press flat and lets the runner break into the second line."
        ]
      };

      const analystNotes = {
        pace_mismatch: "Evidence: repeated carries into the same channel, faster winger vs slower full-back, and multiple recoveries after the defender's first step. This pattern drives direct entries and sustained threat in a single corridor.",
        zone_shift: "Evidence: possession builds on one side, then a rapid switch to the opposite flank. The change in geometry forces the opposing back line to re-form, opening half-space lanes and second-ball windows.",
        one_two: "Evidence: compact support play, timed pass-return, and a forward breaking behind the press. The sequence shortens the threat window while creating a passing angle into the box."
      };

      const modeSelect = document.getElementById('mode');
      const narrativeText = document.getElementById('narrative-text');
      const eventList = document.getElementById('event-list');
      const eventTag = document.getElementById('event-tag');
      const analysisText = document.getElementById('analysis-text');
      const clock = document.getElementById('clock');

      const pitchZones = document.querySelectorAll('.zone');

      function clearHighlights() {
        pitchZones.forEach(zone => zone.classList.remove('active'));
      }

      function highlightZones(zoneIds) {
        clearHighlights();
        zoneIds.forEach((id) => {
          const target = document.querySelector(`.zone[data-zone="${id}"]`);
          if (target) target.classList.add('active');
        });
      }

      function getCasualNarrativeText(data) {
        const template = casualTemplates[data.pattern][data.narrativeKey % casualTemplates[data.pattern].length];
        return template
          .replace('[winger]', 'Adebayo')
          .replace('[fullback]', 'Lewis')
          .replace('[zone]', 'R2')
          .replace('[playerA]', 'Niko')
          .replace('[playerB]', 'Bale')
          .replace('[zone]', 'C2');
      }

      async function fetchSpanishNarrative(englishText) {
        try {
          const response = await fetch('http://localhost:8000/translate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: englishText })
          });

          if (!response.ok) {
            throw new Error('HTTP error');
          }

          const data = await response.json();
          if (!data || data.translation_unavailable) {
            return { text: englishText, unavailable: true };
          }

          return { text: data.translatedText || englishText, unavailable: false };
        } catch (error) {
          return { text: englishText, unavailable: true };
        }
      }

      function renderNarrativeList(current) {
        eventList.innerHTML = [
          `<strong>${current.representative}</strong> — ${current.mainEvent}`,
          ...current.events.map((item) => item)
        ].map((item) => `<li>${item}</li>`).join('');
      }

      async function setMinute(minuteIndex) {
        const current = minutes[minuteIndex];
        const mode = modeSelect.value;

        clock.textContent = `${current.minute}'`;
        eventTag.textContent = current.patternLabel;

        if (mode === 'analyst') {
          narrativeText.innerHTML = `<strong>${current.patternLabel}</strong> — ${analystNotes[current.pattern]}`;
          renderNarrativeList(current);
          analysisText.textContent = `${current.mainEvent} Direct evidence: ${current.events.join(' ')}`;
        } else if (mode === 'casual-spanish') {
          const englishText = getCasualNarrativeText(current);
          const translation = await fetchSpanishNarrative(englishText);
          narrativeText.innerHTML = translation.unavailable
            ? `Translation unavailable: ${englishText}`
            : translation.text;
          renderNarrativeList(current);
          analysisText.textContent = translation.unavailable
            ? 'Translation unavailable'
            : 'Spanish translation loaded';
        } else {
          const englishText = getCasualNarrativeText(current);
          narrativeText.innerHTML = englishText;
          renderNarrativeList(current);
          analysisText.textContent = `Data-backed sequence: ${current.mainEvent} ${current.events[0]} ${current.events[1]}`;
        }

        highlightZones(current.zones);
      }

      function renderChart() {
        const chart = document.getElementById('chart');
        chart.innerHTML = '';

        minutes.forEach((minute, index) => {
          const candle = document.createElement('div');
          const tone = minute.momentum >= 80 ? 'positive' : minute.momentum < 55 ? 'negative' : 'neutral';
          const height = Math.max(34, minute.momentum);
          candle.className = `candle ${tone}`;
          candle.style.height = `${height}%`;
          candle.dataset.index = index;
          candle.title = `${minute.minute}' ${minute.patternLabel}`;
          candle.innerHTML = `<span class="minute-label">${minute.minute}'</span>`;
          candle.addEventListener('click', () => {
            document.querySelectorAll('.candle').forEach((bar) => bar.classList.remove('active'));
            candle.classList.add('active');
            setMinute(index);
          });
          chart.appendChild(candle);
        });

        const first = document.querySelector('.candle');
        if (first) first.classList.add('active');
      }

      modeSelect.addEventListener('change', () => {
        const selectedIndex = [...document.querySelectorAll('.candle')].findIndex((bar) => bar.classList.contains('active'));
        setMinute(selectedIndex >= 0 ? selectedIndex : 0);
      });

      renderChart();
      setMinute(0);
    </script>
  </body>
</html>
