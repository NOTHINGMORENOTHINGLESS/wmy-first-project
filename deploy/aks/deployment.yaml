apiVersion: apps/v1
kind: Deployment
metadata:
  name: football-insights
spec:
  replicas: 2
  selector:
    matchLabels:
      app: football-insights
  template:
    metadata:
      labels:
        app: football-insights
    spec:
      containers:
        - name: football-insights
          image: your-registry.azurecr.io/football-insights:latest
          ports:
            - containerPort: 8501
          env:
            - name: DATASET_PATH
              value: /data/international_results.csv
---
apiVersion: v1
kind: Service
metadata:
  name: football-insights
spec:
  selector:
    app: football-insights
  ports:
    - port: 80
      targetPort: 8501
      protocol: TCP
