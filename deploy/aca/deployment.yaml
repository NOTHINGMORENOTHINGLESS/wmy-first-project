name: football-insights
location: westus
properties:
  managedEnvironmentId: /subscriptions/<subscription-id>/resourceGroups/<resource-group>/providers/Microsoft.App/managedEnvironments/<environment-name>
  configuration:
    ingress:
      external: true
      targetPort: 8501
  template:
    containers:
      - name: football-insights
        image: your-registry.azurecr.io/football-insights:latest
        env:
          - name: DATASET_PATH
            value: /data/international_results.csv
        resources:
          cpu: 0.5
          memory: 1Gi
    scale:
      minReplicas: 1
      maxReplicas: 3
